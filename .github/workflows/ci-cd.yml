name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  lint:
    name: Preverjanje kode
    runs-on: ubuntu-latest
    steps:
      - name: Prevzem kode
        uses: actions/checkout@v4

      - name: Nastavitev Node.js in npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Lint frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint

      - name: Lint backend
        working-directory: backend
        run: |
          npm ci
          npm run lint
  build:
    name: Gradnja
    runs-on: ubuntu-latest
    steps:
      - name: Prevzem kode
        uses: actions/checkout@v4

      - name: Nastavitev Node.js in npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Namestitev frontend odvisnosti
        working-directory: frontend
        run: npm ci

      - name: Gradnja frontenda
        working-directory: frontend
        run: npm run build

      - name: Shrani frontend artefakt
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error

      - name: Namestitev backend odvisnosti
        working-directory: backend
        run: npm ci

      - name: Generiranje Prisma Clienta
        working-directory: backend
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://zalivaj:zalivaj@localhost:5432/zalivaj?schema=public

      - name: Priprava backend paketa
        working-directory: backend
        run: |
          npm prune --omit=dev
          mkdir -p "$GITHUB_WORKSPACE/backend-package"
          cp -R src prisma openapi.yaml package.json package-lock.json node_modules "$GITHUB_WORKSPACE/backend-package/"

      - name: Shrani backend artefakt
        uses: actions/upload-artifact@v4
        with:
          name: backend-package
          path: backend-package/
          include-hidden-files: true
          if-no-files-found: error  
  test:
    name: Testi
    runs-on: ubuntu-latest
    steps:
      - name: Prevzem kode
        uses: actions/checkout@v4

      - name: Nastavitev Node.js in npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Testi frontenda in coverage
        working-directory: frontend
        run: |
          npm ci
          npm test

      - name: Testi backenda in coverage
        working-directory: backend
        run: |
          npm ci
          npm test

      - name: Shrani coverage poročili
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            frontend/coverage/
            backend/coverage/
          if-no-files-found: error     